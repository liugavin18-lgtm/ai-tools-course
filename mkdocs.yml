site_name: AI 工具实战课
site_description: GitHub、MCP、Skill 入门到实战，用大白话讲清楚
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
extra_css:
  - assets/css/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["narration"]
      check_paths: true
nav:
  - 首页: index.md
  - GitHub 入门:
      - GitHub 是什么: github/01-what-is-github.md
      - 建第一个仓库: github/02-first-repo.md
      - 发布成网站: github/03-publish-pages.md
  - MCP 讲解:
      - 1 原理: mcp/01-principles.md
      - 2 安装和使用: mcp/02-use-existing.md
      - 3 动手做第一个服务: mcp/03-first-server.md
      - 4 把工具设计好: mcp/04-design-tools.md
      - 5 安全与权限: mcp/05-security.md
      - 6 实战案例: mcp/06-case-study.md
      - 7 排错手册: mcp/07-troubleshooting.md
      - 8 练习与考核: mcp/08-exercises.md
  - Skill 讲解:
      - Skill 是什么: skill/01-what-is-skill.md
      - 写一个 Skill: skill/02-write-a-skill.md
