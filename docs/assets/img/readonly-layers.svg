<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>只读服务的三道防线（动画）</title><defs><marker id="a-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35f00"/></marker></defs><rect width="860" height="410" rx="14" fill="#f6f8fb"/><rect x="280" y="78" width="16" height="250" rx="4" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="288" y="62" font-size="14" text-anchor="middle" fill="#3f51b5" font-weight="bold">① 只读打开</text><text x="288" y="350" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">mode=ro</text><rect x="420" y="78" width="16" height="250" rx="4" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="428" y="62" font-size="14" text-anchor="middle" fill="#3f51b5" font-weight="bold">② 授权白名单</text><text x="428" y="350" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">set_authorizer</text><rect x="560" y="78" width="16" height="250" rx="4" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="568" y="62" font-size="14" text-anchor="middle" fill="#3f51b5" font-weight="bold">③ 行数与超时</text><text x="568" y="350" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">limit + timeout</text><path d="M715.0,125.0 v150 a55.0,12 0 0 0 110,0 v-150 a55.0,12 0 0 0 -110,0 z" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><ellipse cx="770" cy="125.0" rx="55.0" ry="12" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/><text x="770" y="208" font-size="14" text-anchor="middle" fill="#3f51b5" font-weight="bold">数据库</text><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0200;0.0320;0.3200;1" dur="20s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;500 0;500 0" keyTimes="0;0.0200;0.2200;1" dur="20s" repeatCount="indefinite"/><rect x="24" y="102" width="174" height="36" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="111" y="125" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">SELECT …  正常查询</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2200;0.2320;0.3200;1" dur="20s" repeatCount="indefinite"/><text x="590" y="166" font-size="13.5" text-anchor="start" fill="#2e7d32" font-weight="bold">✓ 正常返回结果</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3400;0.3520;0.6200;1" dur="20s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;214 0;214 0" keyTimes="0;0.3400;0.5000;1" dur="20s" repeatCount="indefinite"/><rect x="24" y="182" width="174" height="36" rx="18" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="111" y="205" font-size="13" text-anchor="middle" fill="#c62828" font-weight="bold">DROP TABLE orders</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5000;0.5120;0.6200;1" dur="20s" repeatCount="indefinite"/><text x="440" y="205" font-size="13.5" text-anchor="start" fill="#c62828" font-weight="bold">✗ 被拒绝：not authorized</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6400;0.6520;0.9400;1" dur="20s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;354 0;354 0" keyTimes="0;0.6400;0.8000;1" dur="20s" repeatCount="indefinite"/><rect x="24" y="262" width="174" height="36" rx="18" fill="#fff4dc" stroke="#a35f00" stroke-width="1.5"/><text x="111" y="285" font-size="13" text-anchor="middle" fill="#a35f00" font-weight="bold">SELECT * 全表（超大）</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8000;0.8120;0.9400;1" dur="20s" repeatCount="indefinite"/><text x="580" y="285" font-size="13.5" text-anchor="start" fill="#a35f00" font-weight="bold">! 只返回前 200 行 / 超时中断</text></g><text x="430" y="390" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">三道防线各管一类问题：任何一层失效，另一层仍能拦住</text></svg>