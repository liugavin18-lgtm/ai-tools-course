<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>危险操作的人工审批闸门流程</title><defs><marker id="a-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35f00"/></marker></defs><rect width="860" height="340" rx="14" fill="#f6f8fb"/><text x="24" y="30" font-size="13" text-anchor="start" fill="#6b7280" font-weight="bold">AI 一侧</text><text x="24" y="192" font-size="13" text-anchor="start" fill="#6b7280" font-weight="bold">人 一侧</text><line x1="24" y1="174" x2="836" y2="174" stroke="#c5cfdd" stroke-width="1" stroke-dasharray="4 4"/><rect x="24" y="50" width="140" height="84" rx="10" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><text x="94" y="86" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold">① 查余额</text><rect x="192" y="50" width="140" height="84" rx="10" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><text x="262" y="86" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold">② 提交申请单</text><text x="262" y="110" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">工具·次数·预计花费</text><rect x="360" y="50" width="140" height="84" rx="10" fill="#fff4dc" stroke="#a35f00" stroke-width="2"/><text x="430" y="86" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold">③ 停下，等待</text><text x="430" y="110" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">拿到申请号 REQ-001</text><rect x="528" y="50" width="140" height="84" rx="10" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><text x="598" y="86" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold">⑤ 调用工具</text><text x="598" y="110" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">批准之后才执行</text><rect x="696" y="50" width="140" height="84" rx="10" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><text x="766" y="86" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold">⑥ 核对并记账</text><text x="766" y="110" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">对比实际花费</text><line x1="164" y1="92" x2="190" y2="92" stroke="#3f51b5" stroke-width="2.2" marker-end="url(#a-pri)"/><line x1="332" y1="92" x2="358" y2="92" stroke="#3f51b5" stroke-width="2.2" marker-end="url(#a-pri)"/><line x1="668" y1="92" x2="694" y2="92" stroke="#3f51b5" stroke-width="2.2" marker-end="url(#a-pri)"/><rect x="300" y="206" width="260" height="76" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="430" y="236" font-size="15" text-anchor="middle" fill="#2e7d32" font-weight="bold">④ 你审核</text><text x="430" y="262" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="normal">回复「批准 REQ-001」</text><line x1="430" y1="134" x2="430" y2="204" stroke="#a35f00" stroke-width="2.2" marker-end="url(#a-amb)"/><text x="440" y="172" font-size="12" text-anchor="start" fill="#a35f00" font-weight="normal">等你的决定</text><path d="M560,244 H598 V136" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#a-ok)"/><text x="610" y="214" font-size="12.5" text-anchor="start" fill="#2e7d32" font-weight="bold">批准</text><text x="430" y="318" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">批准权在人，AI 不能给自己批准；被拦截后不重试、不绕路</text></svg>