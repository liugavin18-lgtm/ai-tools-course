<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>MCP 的三个角色：宿主、客户端、服务端</title><defs><marker id="a-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35f00"/></marker></defs><rect width="860" height="330" rx="14" fill="#f6f8fb"/><rect x="20" y="30" width="340" height="270" rx="16" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><text x="190" y="58" font-size="16" text-anchor="middle" fill="#3f51b5" font-weight="bold">AI 应用（Host）</text><text x="190" y="78" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">例：Claude Code、Kimi</text><rect x="50" y="100" width="280" height="56" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="190" y="124" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">AI 模型</text><text x="190" y="144" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">听懂你的话，决定该用哪个工具</text><line x1="190" y1="158" x2="190" y2="200" stroke="#3f51b5" stroke-width="2" marker-end="url(#a-pri)"/><rect x="50" y="202" width="280" height="56" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="190" y="226" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">MCP 客户端</text><text x="190" y="246" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">负责“说 MCP”，每连一个服务就有一个</text><rect x="540" y="30" width="300" height="120" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="690" y="58" font-size="15" text-anchor="middle" fill="#2e7d32" font-weight="bold">MCP 服务（本地）</text><text x="690" y="80" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">你写的 Python 程序</text><text x="690" y="106" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Tool · Resource · Prompt</text><text x="690" y="130" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">→ 本机的数据库、文件</text><rect x="540" y="190" width="300" height="110" rx="14" fill="#ffffff" stroke="#a35f00" stroke-width="2"/><text x="690" y="218" font-size="15" text-anchor="middle" fill="#a35f00" font-weight="bold">MCP 服务（远程）</text><text x="690" y="240" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">别人提供的云端服务</text><text x="690" y="266" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">出图、在线文档……</text><text x="690" y="286" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">常需要登录授权</text><line x1="332" y1="226" x2="538" y2="100" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-ok)"/><text x="478" y="210" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">stdio（本地进程）</text><line x1="332" y1="240" x2="538" y2="245" stroke="#a35f00" stroke-width="2.5" marker-end="url(#a-amb)"/><text x="440" y="272" font-size="13" text-anchor="middle" fill="#a35f00" font-weight="bold">HTTP（联网）</text></svg>