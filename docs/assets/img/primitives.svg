<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 226" width="860" height="226" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>MCP 服务端的三类能力</title><defs><marker id="a-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35f00"/></marker></defs><rect width="860" height="226" rx="14" fill="#f6f8fb"/><rect x="20" y="20" width="260" height="150" rx="12" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/><path d="M20,32 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v28 h-260 z" fill="#3f51b5"/><text x="150" y="48" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Tool 工具</text><text x="36" y="92" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">谁触发：AI 模型自己决定</text><text x="36" y="120" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">做什么：执行动作、查询数据</text><text x="36" y="148" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">类比：一个可以按的按钮</text><rect x="300" y="20" width="260" height="150" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><path d="M300,32 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v28 h-260 z" fill="#2e7d32"/><text x="430" y="48" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Resource 资源</text><text x="316" y="92" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">谁触发：应用或用户选择加载</text><text x="316" y="120" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">做什么：提供可阅读的资料</text><text x="316" y="148" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">类比：一份可以翻阅的资料</text><rect x="580" y="20" width="260" height="150" rx="12" fill="#ffffff" stroke="#a35f00" stroke-width="2"/><path d="M580,32 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v28 h-260 z" fill="#a35f00"/><text x="710" y="48" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Prompt 提示词模板</text><text x="596" y="92" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">谁触发：用户主动选用</text><text x="596" y="120" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">做什么：预设提问方式和步骤</text><text x="596" y="148" font-size="13.5" text-anchor="start" fill="#1f2937" font-weight="normal">类比：一张填空的表单</text><text x="430" y="202" font-size="15" text-anchor="middle" fill="#3f51b5" font-weight="bold">日常 90% 的场景，只用 Tool 就够了</text></svg>